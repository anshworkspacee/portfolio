<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="Ansh Shrivastav — Portfolio Social Card">
  <defs>
    <linearGradient id="ogBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#07070a"/>
      <stop offset="60%" stop-color="#14080e"/>
      <stop offset="100%" stop-color="#07070a"/>
    </linearGradient>
    <radialGradient id="ogGlow" cx="80%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#ff3d5a" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#e5132b" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f4f1ec"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#ogBg)"/>
  <rect width="1200" height="630" fill="url(#ogGlow)"/>

  <!-- Subtle framing rings -->
  <g stroke="#ffffff" fill="none" opacity="0.08">
    <circle cx="950" cy="315" r="280"/>
    <circle cx="950" cy="315" r="200" stroke-dasharray="10 8"/>
    <line x1="100" y1="520" x2="1100" y2="520"/>
  </g>

  <!-- Brand badge -->
  <g transform="translate(100, 100)">
    <rect width="140" height="32" rx="16" fill="#e5132b" fill-opacity="0.2" stroke="#e5132b" stroke-opacity="0.6"/>
    <text x="70" y="21" font-family="'Inter', sans-serif" font-size="11" font-weight="700" letter-spacing="3" fill="#ff3d5a" text-anchor="middle">
      ANSH ORIGINAL
    </text>
  </g>

  <!-- Big Title -->
  <text x="100" y="240" font-family="'Bebas Neue', Impact, sans-serif" font-size="110" font-weight="700" letter-spacing="4" fill="url(#textGrad)">
    ANSH SHRIVASTAV
  </text>
  <text x="104" y="285" font-family="'Inter', sans-serif" font-size="20" font-weight="700" letter-spacing="8" fill="#ff3d5a">
    THE BUILDER · WEBYONEEC FOUNDER
  </text>

  <!-- Description -->
  <text x="104" y="345" font-family="'Inter', sans-serif" font-size="18" fill="#a7a6ad" opacity="0.9">
    Personal portfolio featuring real projects: BEMATLAB, SSA Hotels, Ansh Demo, and WEBYONEEC.
  </text>
  <text x="104" y="375" font-family="'Inter', sans-serif" font-size="18" fill="#a7a6ad" opacity="0.9">
    Student &amp; Web Developer · Built with React, TypeScript, and modern web craft.
  </text>

  <!-- Pill tags -->
  <g transform="translate(104, 430)">
    <rect x="0" y="0" width="130" height="36" rx="18" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.15"/>
    <text x="65" y="23" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#f4f1ec" text-anchor="middle">Quick Commerce</text>

    <rect x="145" y="0" width="125" height="36" rx="18" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.15"/>
    <text x="207" y="23" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#f4f1ec" text-anchor="middle">Hospitality Web</text>

    <rect x="285" y="0" width="115" height="36" rx="18" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.15"/>
    <text x="342" y="23" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#f4f1ec" text-anchor="middle">UI Lab Demo</text>

    <rect x="415" y="0" width="165" height="36" rx="18" fill="#e5132b" fill-opacity="0.25" stroke="#e5132b" stroke-opacity="0.5"/>
    <text x="497" y="23" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#ff3d5a" text-anchor="middle">WEBYONEEC Agency</text>
  </g>

  <!-- Monogram on the right -->
  <g transform="translate(950, 315)">
    <circle r="140" fill="#07070a" stroke="#ff3d5a" stroke-opacity="0.4" stroke-width="2"/>
    <text x="0" y="45" font-family="'Bebas Neue', Impact, sans-serif" font-size="140" font-weight="700" fill="#f4f1ec" text-anchor="middle">
      A.
    </text>
  </g>

  <!-- Footer url -->
  <text x="100" y="565" font-family="'Inter', sans-serif" font-size="14" font-weight="600" letter-spacing="2" fill="#6d6c75">
    WEBYONEEC.WEB.APP · GITHUB.COM/ANSHWORKSPACEE
  </text>
</svg>
